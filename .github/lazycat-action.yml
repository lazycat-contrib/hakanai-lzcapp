version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: build/hakanai.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: hakanai

build:
  toolchains: []
  run_buildscript: false

images:
  - id: hakanai
    target: service
    service: hakanai
    source: ghcr.io/czerwonk/hakanai
    channel: stable
    tag_regex: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    retry:
      enabled: false
      max_attempts: 3
      initial_delay: 2s
      max_delay: 30s
    application:
      language: zh
      name: Hakanai
      source: https://github.com/czerwonk/hakanai
      source_author: czerwonk
  private:
    enabled: true
    skip_if_version_exists: true
    name: Hakanai
    summary: "Hakanai LazyCat package published from GitHub Actions."
